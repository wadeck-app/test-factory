name: CI

on:
    push:
        branches: [main, integration]
    pull_request:
        branches: [main, integration]
    workflow_dispatch:

permissions:
    contents: read
    packages: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            - name: Syntax of the factory scripts
              run: npm run check:scripts

            - name: Violations
              run: npm run violations

            - name: Check app-module layout and manifest
              run: npm run check

            - name: Bundle
              run: npm run bundle
              env:
                  BUNDLE_VERSION: 0.0.0-ci
