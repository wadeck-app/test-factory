# Build flow for a feature task. Manual run (no dispatcher yet):
#   flow run flows/03_build_feature.yml -i taskId=<id> -i NPM_TOKEN=file://./_secrets_/npm-read-token --wait
#
#   sync       host   sanitize the slot's .git, fetch, create branch <taskId>-<slug> from origin/integration
#   fetch_task host   task text for the model
#   implement  VM     model step (no git rights: tools deny + sandbox without git credentials)
#   gates      VM     npm ci (token only here, env-only), build, test, violations, app-module check
#   commit     host   verify the model did not touch git, sanitize .git, commit on the branch
#   push       host   push the task branch (the integrator fetches it from origin)
#
# FACTORY_DIR is hardcoded for the single test project (see .claude/plans/2026-11-14_factory-architecture.md).

id: build_feature
version: '0.2.0'
name: 'Build a feature'
description: 'Sync a pool slot on integration, implement the task with a sandboxed model, run the gates, commit and push the task branch'

requires: [sandbox]

workspace: { provider: pool, dir: C:/Workspace_Tooling, prefix: _test-factory_wt, count: 4 }

inputs:
  taskId: text
  NPM_TOKEN:
    type: password
    description: 'read:packages token for npm.pkg.github.com, pass as file://./_secrets_/npm-read-token'
    required: true

steps:
  - id: sync
    name: 'Sync the slot on origin/integration and create the task branch'
    type: script
    host: true
    captureOutput: stdout
    env:
      TASK_ID: ${{ inputs.taskId }}
    script: |
      set -euo pipefail
      FACTORY_DIR=C:/Workspace_Tooling/_test-factory
      bash "$FACTORY_DIR/flows/lib/sanitize-git.sh" https://github.com/wadeck-app/test-factory
      branch=$(task show "$TASK_ID" -p test-factory --json | node "$FACTORY_DIR/flows/lib/branch-name.mjs")
      git fetch -q origin
      git checkout -q -f -B "$branch" origin/integration
      git clean -fdq
      echo "$branch"

  - id: fetch_task
    name: 'Fetch the task text'
    type: script
    host: true
    captureOutput: stdout
    depends: [sync]
    env:
      TASK_ID: ${{ inputs.taskId }}
    script: |
      set -euo pipefail
      task show "$TASK_ID" -p test-factory

  - id: implement
    name: 'Implement the task'
    type: model
    model: sonnet
    depends: [fetch_task]
    tools: [read, write, edit, glob, grep, bash]
    # No interactive approval in a headless sandbox run: the VM and the git deny hooks are the guardrails.
    skipPermissions: true
    # Defense in depth: the sandbox has no git credentials and the commit is a host step (checked again in "commit").
    toolHooks:
      - timing: before
        action: { type: deny, reason: 'git commit/push are done by the flow, never by the model', toolPattern: '*', argsContains: 'git commit' }
      - timing: before
        action: { type: deny, reason: 'git commit/push are done by the flow, never by the model', toolPattern: '*', argsContains: 'git push' }
    prompt: |
      You work in a git clone (your working directory) of the repository "test-factory", already on the task branch.
      Implement the task below. Rules:
      - Only edit files under packages/. Follow the existing layout of packages/app-module-school (app-core app-module: views are YAML in src/dsl-views, backend in src/backend/index.ts).
      - No dependencies are installed while you work, so you cannot run the tests or the compiler: reason carefully and keep the change small. The flow runs build, tests and violations after you.
      - Never run git commit, git push, git checkout or git reset: the flow commits for you.
      - Finish with a short summary of what you changed.

      The task (JSON of the task tracker, follow its description literally):
      ${{ steps.fetch_task.outputs.stdout }}

  - id: gates
    name: 'Install, build, test, violations, app-module check (VM)'
    type: script
    depends: [implement]
    secrets: [NPM_TOKEN]
    timeout: 600
    script: |
      set -euo pipefail
      # The token goes to npm only through a throwaway config read from a file descriptor: never written to disk,
      # and removed from the environment of the npm process. --ignore-scripts: no package code runs while the token is around.
      env -u NPM_TOKEN npm ci --ignore-scripts --userconfig <(printf '//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN")
      npm run build
      npm test
      npm run violations
      npm run check

  - id: commit
    name: 'Commit the change on the task branch'
    type: script
    host: true
    depends: [gates]
    env:
      TASK_ID: ${{ inputs.taskId }}
    script: |
      set -euo pipefail
      FACTORY_DIR=C:/Workspace_Tooling/_test-factory
      bash "$FACTORY_DIR/flows/lib/sanitize-git.sh" https://github.com/wadeck-app/test-factory
      EXPECTED=$(task show "$TASK_ID" -p test-factory --json | node "$FACTORY_DIR/flows/lib/branch-name.mjs")
      BRANCH=$(git rev-parse --abbrev-ref HEAD)
      # The toolHooks deny is a substring match ("git -c x=y commit" passes it): the host verifies the model did not touch git.
      if [ "$BRANCH" != "$EXPECTED" ]; then
        echo "commit: the model left the slot on branch '$BRANCH' instead of '$EXPECTED': it used git, which a build step must not do. Slot: $(pwd)" >&2
        exit 1
      fi
      AHEAD=$(git rev-list --count origin/integration..HEAD)
      if [ "$AHEAD" != "0" ]; then
        echo "commit: branch '$BRANCH' has $AHEAD commit(s) the model made itself (git commit is forbidden in a build step). Inspect with: git -C $(pwd) log origin/integration..HEAD" >&2
        exit 1
      fi
      # node_modules and build output are ignored by .gitignore; nothing else from the gates may be committed.
      git add -A
      if git diff --cached --quiet; then
        echo "commit: the model changed nothing on branch $BRANCH" >&2
        exit 1
      fi
      git -c user.name="test-factory-builder" -c user.email="builder@test-factory.invalid" commit -q -m "feat($TASK_ID): $EXPECTED"
      git log --oneline -1

  - id: push
    name: 'Push the task branch'
    type: script
    host: true
    depends: [commit]
    script: |
      set -euo pipefail
      FACTORY_DIR=C:/Workspace_Tooling/_test-factory
      bash "$FACTORY_DIR/flows/lib/sanitize-git.sh" https://github.com/wadeck-app/test-factory
      BRANCH=$(git rev-parse --abbrev-ref HEAD)
      # Only a task branch (<id>-<slug>) is ever pushed here, never main or integration.
      case "$BRANCH" in main|integration) echo "push: refusing to push $BRANCH from a build slot" >&2; exit 1;; esac
      git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
