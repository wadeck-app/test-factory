# Integration flow: merge a pushed task branch into `integration` without conflict, gates, push. Manual run:
#   flow run flows/04_integrate.yml -i taskId=<id> --wait
#
# One slot (_test-factory_int1) = one integration at a time (the pool serializes the runs).
#
#   prepare    host   fetch, local `integration` = origin/integration, merge origin/<branch> WITHOUT committing.
#                     Conflict: abort the merge, comment the task, send it back to `planned`, fail.
#   install    host   npm ci for the Linux VM on the merged tree (registry access of the host user: no token reaches the VM)
#   gates      VM     build, test, violations, app-module check on the merged tree
#   finalize   host   check the merge is intact, commit the merge, push integration, task -> `integrated`
#
# A task sent back after a conflict is built again from its pushed branch: the build flows merge origin/integration into it and the model resolves the conflicts.

id: integrate
version: '0.2.0'
name: 'Integrate a task branch'
description: 'Merge the task branch into integration without conflict, run the gates, push integration'

requires: [sandbox]

workspace: { provider: pool, dir: C:/Workspace_Tooling, prefix: _test-factory_int, count: 1 }

inputs:
  taskId: text

steps:
  - id: prepare
    name: 'Merge the task branch into integration (no commit)'
    type: script
    host: true
    captureOutput: stdout
    env:
      TASK_ID: ${{ inputs.taskId }}
    script: |
      set -euo pipefail
      FACTORY_DIR=C:/Workspace_Tooling/_test-factory
      bash "$FACTORY_DIR/flows/lib/sanitize-git.sh" https://github.com/wadeck-app/test-factory
      BRANCH=$(task show "$TASK_ID" -p test-factory --json | node "$FACTORY_DIR/flows/lib/branch-name.mjs")
      git fetch -q origin
      if ! git rev-parse -q --verify "origin/$BRANCH" >/dev/null; then
        echo "prepare: origin/$BRANCH does not exist: the build flow has not pushed the branch of task $TASK_ID yet." >&2
        exit 1
      fi
      git checkout -q -f -B integration origin/integration
      git clean -fdq
      if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
        echo "prepare: origin/$BRANCH is already contained in integration, nothing to merge." >&2
        exit 1
      fi
      if ! git -c user.name="test-factory-integrator" -c user.email="integrator@test-factory.invalid" merge --no-commit --no-ff "origin/$BRANCH" >&2; then
        CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
        git merge --abort || true
        task comment "$TASK_ID" -p test-factory --author test-factory-integrator "Integration refused: merging $BRANCH into integration conflicts in: $CONFLICTS. Update the branch from integration and resolve the conflicts, then it will be integrated again." >&2
        task set-status "$TASK_ID" planned -p test-factory >&2
        echo "prepare: merge conflict in: $CONFLICTS (task $TASK_ID commented and sent back to planned)" >&2
        exit 3
      fi
      echo "$BRANCH"

  - id: install
    name: 'Install the dependencies of the merged tree for the VM'
    type: script
    host: true
    depends: [prepare]
    timeout: 600
    script: |
      set -euo pipefail
      bash C:/Workspace_Tooling/_test-factory/flows/lib/install-deps.sh

  - id: gates
    name: 'Build, test, violations, app-module check on the merged tree (VM)'
    type: script
    shell: bash
    depends: [install]
    timeout: 600
    script: |
      set -euo pipefail
      npm run build
      npm test
      npm run violations
      npm run check

  - id: finalize
    name: 'Commit the merge, push integration, mark the task integrated'
    type: script
    host: true
    depends: [gates]
    env:
      TASK_ID: ${{ inputs.taskId }}
    script: |
      set -euo pipefail
      FACTORY_DIR=C:/Workspace_Tooling/_test-factory
      bash "$FACTORY_DIR/flows/lib/sanitize-git.sh" https://github.com/wadeck-app/test-factory
      BRANCH=$(task show "$TASK_ID" -p test-factory --json | node "$FACTORY_DIR/flows/lib/branch-name.mjs")
      if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
        echo "finalize: no merge in progress in $(pwd): the gates removed it. Nothing is pushed." >&2
        exit 1
      fi
      # The gates run agent-written code in the VM: the merged tree must be exactly what was staged.
      if ! git diff --quiet; then
        echo "finalize: the gates modified tracked files of the merged tree ($(git diff --name-only | tr '\n' ' ')). Nothing is pushed." >&2
        exit 1
      fi
      git -c user.name="test-factory-integrator" -c user.email="integrator@test-factory.invalid" commit -q -m "merge: $BRANCH (task $TASK_ID)"
      # Plain push, never forced: a concurrent push to integration makes it fail loudly, rerun the flow.
      git push origin HEAD:refs/heads/integration
      task set-status "$TASK_ID" integrated -p test-factory
      task comment "$TASK_ID" -p test-factory --author test-factory-integrator "Integrated: $BRANCH merged into integration ($(git rev-parse --short HEAD)), gates passed."
      git log --oneline -1
