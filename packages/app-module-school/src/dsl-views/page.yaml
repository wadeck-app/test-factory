$sources:
  summary:
    url: GET /api/modules/school/summary

$type: VerticalStack
items:
  - $type: HorizontalStack
    items:
      - { $type: StatTile, label: Classrooms, value: $sources.summary.classrooms }
      - { $type: StatTile, label: Student classes, value: $sources.summary.studentClasses }
      - { $type: StatTile, label: Teachers, value: $sources.summary.teachers }
      - { $type: StatTile, label: Courses, value: $sources.summary.courses }
